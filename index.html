<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jays Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#4a1f33;--mute:#a0607a;--line:#ffc2d6;--soft:#ffd6e5;--rose:#e6417f;--rosed:#c42a66;--bad:#ffc9d6;--warn:#ffe9b8;--ok:#dff5d8;--grad:linear-gradient(135deg,#ff7eb3,#e6417f)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#ffd0e2,#fff0f6 40%,#fff);color:var(--ink);font:14px Poppins,system-ui,sans-serif}header{position:sticky;top:0;z-index:2;background:var(--grad);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;box-shadow:0 4px 16px #e6417f55}h1,h2{font-family:'Playfair Display',Georgia,serif;margin:0}h1{font-size:24px}h2{font-size:20px;color:var(--rosed)}button{font:inherit;cursor:pointer;border:0}button:disabled{opacity:.6;cursor:wait}.wrap{max-width:1200px;margin:auto;padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 6px 18px #e6417f22;margin:10px 0}.login{max-width:420px;margin:7vh auto;text-align:center}.hint{font-size:12px;color:var(--mute)}input,select{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px;min-width:0}input:focus,select:focus{outline:2px solid #ff9fc0}.login input{width:100%;margin:6px 0;text-align:center}.btn,.ghost{padding:9px 14px;border-radius:11px;font-weight:500}.btn{background:var(--grad);color:#fff}.ghost{background:var(--soft);color:var(--rosed)}.bar,.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.nav{background:#ffffff55;border-radius:30px;padding:4px}.nav button{background:transparent;color:#fff;padding:7px 12px;border-radius:20px}.nav button.on{background:#fff;color:var(--rosed)}.seg{display:flex;background:var(--soft);border-radius:24px;padding:4px;margin:12px 0}.seg button{flex:1;background:none;color:var(--rosed);padding:8px;border-radius:20px}.seg button.on{background:var(--grad);color:white}.err{color:#c0143c;min-height:20px;font-size:13px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.pick{text-align:left;width:100%;color:var(--rosed)}.pick b{display:block;font-size:17px}.stat{background:var(--grad);color:#fff}.stat small{display:block}.stat strong{font-size:22px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fff}table{border-collapse:collapse;width:100%;min-width:750px}th,td{text-align:left;padding:7px;border-bottom:1px solid var(--line)}th{background:var(--soft)}td input,td select{width:100%;min-width:100px}.item{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 2px}.item span:first-of-type{flex:1}.done{text-decoration:line-through;opacity:.55}.badge{display:inline-block;border-radius:20px;padding:2px 8px;background:var(--soft);font-size:11px}.notice{padding:12px;border-radius:12px;background:var(--warn);margin:10px 0;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap}
  </style>
</head>
<body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
  const root=document.getElementById('root');
  function showFatal(message){root.innerHTML='<main class="wrap"><section class="card"><h2>Jays Ledger could not start</h2><p class="notice"></p><p>Reload the page. If it persists, check that the React, HTM, and Supabase CDN scripts are reachable.</p></section></main>';root.querySelector('.notice').textContent=message||'A startup error occurred.';}
  window.addEventListener('error',function(e){if(root&&!root.hasChildNodes())showFatal(e.message);});
  window.addEventListener('unhandledrejection',function(e){console.error('Unhandled app error:',e.reason);});
  try{
    if(!window.React||!window.ReactDOM||!window.htm)throw new Error('A required app library did not load. Check your connection or CDN access.');
    const {useState,useEffect}=React,html=htm.bind(React.createElement);
    const SUPABASE_URL='https://mpcwadvhhemkmsdzxuhq.supabase.co';
    const SUPABASE_KEY='sb_publishable_rTfYJIm1l_O-y-PYzUdD1w_xSIWfLxD';
    let db=null,configError='';
    try{if(!window.supabase||typeof window.supabase.createClient!=='function')throw new Error('Supabase client library did not load.');db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);}catch(e){configError=e.message;}
    const uid=()=>Math.random().toString(36).slice(2,10),today=()=>new Date().toISOString().slice(0,10),cash=n=>'₦'+Math.round(Number(n)||0).toLocaleString();
    function phoneE164(raw){let d=String(raw||'').replace(/\D/g,'');if(d.startsWith('0'))d='234'+d.slice(1);if(!d.startsWith('234')&&d.length<=10)d='234'+d;return '+'+d;}
    function seed(){return {businesses:[{id:uid(),name:"jay's_apparel",groups:[{id:uid(),name:'In Stock',stock:true,rows:[]},{id:uid(),name:'Orders',stock:false,rows:[]}]}],tasks:[],habits:[]};}
    async function readLedger(userId){const {data,error}=await db.from('accounts').select('data').eq('user_id',userId).maybeSingle();if(error)throw error;if(!data)return null;return typeof data.data==='string'?JSON.parse(data.data):data.data;}
    async function saveLedger(userId,phone,ledger){const {error}=await db.from('accounts').upsert({phone,user_id:userId,data:ledger,updated_at:new Date().toISOString()},{onConflict:'phone'});if(error)throw error;}
    function Login({onLogin}){
      const [mode,setMode]=useState('login'),[phone,setPhone]=useState(''),[code,setCode]=useState(''),[sent,setSent]=useState(false),[busy,setBusy]=useState(false),[error,setError]=useState('');
      const send=async()=>{setError('');if(!db)return setError(configError||'Supabase is unavailable.');const p=phoneE164(phone);if(p.length<10)return setError('Enter a valid phone number, including country code.');setBusy(true);try{const {error:e}=await db.auth.signInWithOtp({phone:p,options:{shouldCreateUser:mode==='register'}});if(e)throw e;setPhone(p);setSent(true);}catch(e){setError(e.message||'Could not send verification code. Check Phone Auth and SMS settings in Supabase.');}finally{setBusy(false)}};
      const verify=async()=>{setError('');if(!code.trim())return setError('Enter the SMS verification code.');setBusy(true);try{const p=phoneE164(phone);const {data,error:e}=await db.auth.verifyOtp({phone:p,token:code.trim(),type:'sms'});if(e)throw e;if(!data.user)throw new Error('Verified session did not include a user.');let ledger=await readLedger(data.user.id);if(!ledger){if(mode!=='register')throw new Error('No ledger exists for this account. Choose Register first.');ledger=seed();await saveLedger(data.user.id,p,ledger);}onLogin({id:data.user.id,phone:p},ledger);}catch(e){setError(e.message||'Could not verify the code.');}finally{setBusy(false)}};
      return html`<main class="wrap"><section class="card login"><div style=${{fontSize:48}}>💖</div><h1 style=${{color:'#c42a66'}}>Jays Ledger</h1><p class="hint">Sign in with a one-time phone code to sync your ledger across devices.</p><div class="seg"><button className=${mode==='login'?'on':''} onClick=${()=>{setMode('login');setSent(false);setCode('');setError('')}}>Login</button><button className=${mode==='register'?'on':''} onClick=${()=>{setMode('register');setSent(false);setCode('');setError('')}}>Register</button></div><input type="tel" inputMode="tel" placeholder="Phone number, e.g. 0801 234 5678" value=${phone} onChange=${e=>setPhone(e.target.value)} /><${sent?html`<input inputMode="numeric" autoComplete="one-time-code" placeholder="SMS verification code" value=${code} onChange=${e=>setCode(e.target.value)} />`:null}<div class="err">${error}</div><button class="btn" disabled=${busy} onClick=${sent?verify:send}>${busy?'Please wait…':sent?'Verify code':'Send code'}</button>${configError?html`<p class="hint">${configError}</p>`:null}</section></main>`;
    }
    function App(){
      const [account,setAccount]=useState(null),[ledger,setLedger]=useState(null),[tab,setTab]=useState('business'),[businessId,setBusinessId]=useState(null),[groupId,setGroupId]=useState(null),[status,setStatus]=useState('');
      useEffect(()=>{if(!account||!ledger)return;const t=setTimeout(async()=>{try{await saveLedger(account.id,account.phone,ledger);setStatus('Saved to Supabase');}catch(e){setStatus('Save failed: '+e.message);}},500);return()=>clearTimeout(t)},[account,ledger]);
      const update=fn=>setLedger(prev=>{const copy=JSON.parse(JSON.stringify(prev));fn(copy);return copy;});
      if(!account)return html`<${Login} onLogin=${(a,d)=>{setAccount(a);setLedger(d)}} />`;
      const biz=ledger.businesses.find(b=>b.id===businessId),group=biz&&biz.groups.find(g=>g.id===groupId);
      const signOut=async()=>{try{await db.auth.signOut()}catch(e){}setAccount(null);setLedger(null);setBusinessId(null);setGroupId(null)};
      const addBusiness=()=>{const name=prompt('Business name?');if(!name||!name.trim())return;const b={id:uid(),name:name.trim(),groups:[{id:uid(),name:'In Stock',stock:true,rows:[]},{id:uid(),name:'Orders',stock:false,rows:[]}]};update(d=>d.businesses.push(b));setBusinessId(b.id);setGroupId(null)};
      const addGroup=()=>{const name=prompt('Group name?');if(!name||!name.trim())return;const g={id:uid(),name:name.trim(),stock:false,rows:[]};update(d=>d.businesses.find(x=>x.id===biz.id).groups.push(g));setGroupId(g.id)};
      const addRow=()=>update(d=>d.businesses.find(x=>x.id===biz.id).groups.find(x=>x.id===group.id).rows.push({id:uid(),buyer:'',item:'',cost:'',sell:'',qty:1,paid:'',due:'',notes:''}));
      const addTask=()=>{const text=prompt('Task?');if(text&&text.trim())update(d=>d.tasks.push({id:uid(),text:text.trim(),date:today(),done:false,priority:'Medium'}))};
      const addHabit=()=>{const name=prompt('Habit?');if(name&&name.trim())update(d=>d.habits.push({id:uid(),name:name.trim(),log:{}}))};
      const toggleHabit=id=>update(d=>{const h=d.habits.find(x=>x.id===id);h.log=h.log||{};h.log[today()]=!h.log[today()]});
      const total=()=>{let revenue=0,profit=0,pending=0;ledger.businesses.forEach(b=>b.groups.forEach(g=>g.rows.forEach(r=>{const qty=Number(r.qty)||0,sell=Number(r.sell)||0,cost=Number(r.cost)||0,paid=Number(r.paid)||0;revenue+=sell*qty;profit+=(sell-cost)*qty;pending+=Math.max(0,sell*qty-paid)})));return{revenue,profit,pending}};
      const t=total();
      return html`<><header><h1>💖 Jays Ledger</h1><div class="nav"><button className=${tab==='business'?'on':''} onClick=${()=>{setTab('business');setBusinessId(null);setGroupId(null)}}>Business Tracker</button><button className=${tab==='daily'?'on':''} onClick=${()=>setTab('daily')}>Daily Activities</button></div><div class="actions"><span>${status}</span><button class="ghost" onClick=${signOut}>Sign out</button></div></header><main class="wrap">
        ${tab==='business'?html`<div class="cards"><div class="card stat"><small>Total Revenue</small><strong>${cash(t.revenue)}</strong></div><div class="card stat"><small>Total Profit</small><strong>${cash(t.profit)}</strong></div><div class="card stat"><small>Pending Balances</small><strong>${cash(t.pending)}</strong></div></div>
          ${!biz?html`<div class="bar"><h2 style=${{flex:1}}>Businesses</h2><button class="btn" onClick=${addBusiness}>+ Add business</button></div><div class="cards">${ledger.businesses.map(b=>html`<button class="card pick" key=${b.id} onClick=${()=>{setBusinessId(b.id);setGroupId(null)}}><b>🛍️ ${b.name}</b><span>${b.groups.reduce((n,g)=>n+g.rows.length,0)} entries</span></button>`)}</div>`:!group?html`<button class="ghost" onClick=${()=>setBusinessId(null)}>← Businesses</button><h2>${biz.name}</h2><div class="cards">${biz.groups.map(g=>html`<button class="card pick" key=${g.id} onClick=${()=>setGroupId(g.id)}><b>${g.stock?'📦':'🧾'} ${g.name}</b><span>${g.rows.length} entries</span></button>`)}<button class="card pick" onClick=${addGroup}><b>+ Add group</b></button></div>`:html`<button class="ghost" onClick=${()=>setGroupId(null)}>← ${biz.name}</button><h2>${group.name}</h2><div class="bar"><button class="btn" onClick=${addRow}>+ Add row</button></div><div class="tablewrap"><table><thead><tr>${['Buyer','Item','Cost','Selling price','Qty','Paid','Due date','Notes',''].map(x=>html`<th>${x}</th>`)}</tr></thead><tbody>${group.rows.map(r=>html`<tr key=${r.id}>${[['buyer','text'],['item','text'],['cost','number'],['sell','number'],['qty','number'],['paid','number'],['due','date'],['notes','text']].map(([k,type])=>html`<td><input type=${type} value=${r[k]??''} onChange=${e=>update(d=>{const row=d.businesses.find(x=>x.id===biz.id).groups.find(x=>x.id===group.id).rows.find(x=>x.id===r.id);row[k]=e.target.value})} /></td>`)}<td><button class="ghost" onClick=${()=>update(d=>{const g=d.businesses.find(x=>x.id===biz.id).groups.find(x=>x.id===group.id);g.rows=g.rows.filter(x=>x.id!==r.id)})}>Delete</button></td></tr>`)}</tbody></table>${!group.rows.length?html`<p class="hint" style=${{padding:16}}>No rows yet. Add your first row.</p>`:null}</div>`}`:html`<div class="two"><section class="card"><div class="bar"><h2 style=${{flex:1}}>Daily tasks</h2><button class="btn" onClick=${addTask}>+ Task</button></div>${ledger.tasks.map(task=>html`<div class="item" key=${task.id}><input type="checkbox" checked=${!!task.done} onChange=${()=>update(d=>{d.tasks.find(x=>x.id===task.id).done=!task.done})} /><span className=${task.done?'done':''}>${task.text}</span><button class="ghost" onClick=${()=>update(d=>{d.tasks=d.tasks.filter(x=>x.id!==task.id)})}>Delete</button></div>`)}</section><section class="card"><div class="bar"><h2 style=${{flex:1}}>Habits</h2><button class="btn" onClick=${addHabit}>+ Habit</button></div>${ledger.habits.map(h=>html`<div class="item" key=${h.id}><input type="checkbox" checked=${!!(h.log&&h.log[today()])} onChange=${()=>toggleHabit(h.id)} /><span>${h.name}</span><button class="ghost" onClick=${()=>update(d=>{d.habits=d.habits.filter(x=>x.id!==h.id)})}>Delete</button></div>`)}</section></div>`}
      </main></>`;
    }
    ReactDOM.createRoot(root).render(html`<${App} />`);
  }catch(e){console.error('Jays Ledger startup error:',e);showFatal(e&&e.message);}
})();
</script>
</body></html>
